<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CircleCI — credit usage</title>
<style>
  :root { color-scheme: light dark; }
  html, body { background: #0f172a; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 7px 10px 4px; font-size: 12px; line-height: 1.3; color: #e2e8f0; }
  @media (prefers-color-scheme: light) { html, body { background: #ffffff; } body { color: #1e293b; } }
  h1 { font-size: 12px; margin: 0; font-weight: 600; display: inline; }
  .meta { font-size: 9.5px; opacity: .55; display: inline; margin-left: 6px; }

  .cycle { margin: 4px 0 6px; }
  .cycle .bar { height: 6px; background: rgba(148,163,184,.2); border-radius: 3px; overflow: hidden; }
  .cycle .bar > div { height: 100%; background: #60a5fa; border-radius: 3px; }
  .cycle .sub { font-size: 9.5px; opacity: .7; margin-top: 2px; }

  .buckets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .bucket { border: 1px solid rgba(148,163,184,.22); border-radius: 5px; padding: 5px 7px; }
  .bucket .blabel { font-size: 8px; text-transform: uppercase; letter-spacing: .04em; opacity: .7; }
  .bucket .row1 { display: flex; align-items: baseline; justify-content: space-between; }
  .bucket .bnum { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bucket .bsub { font-size: 8.5px; opacity: .6; margin-top: 1px; }
  .badge { font-size: 7.5px; font-weight: 700; padding: 0 5px; border-radius: 7px; text-transform: uppercase; }
  .badge.on-track { background: rgba(74,222,128,.18); color: #4ade80; }
  .badge.at-risk { background: rgba(245,158,11,.18); color: #f59e0b; }
  .badge.exceed { background: rgba(239,68,68,.18); color: #ef4444; }
  .bar { height: 5px; background: rgba(148,163,184,.2); border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 3px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: right; padding: 2px 6px; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 8px; text-transform: uppercase; letter-spacing: .04em; opacity: .6; border-bottom: 1px solid rgba(148,163,184,.3); }
  td { border-bottom: 1px solid rgba(148,163,184,.1); font-size: 11px; }
  tr:last-child td { border-bottom: none; }
  tr.total td { border-top: 2px solid rgba(148,163,184,.4); font-weight: 700; }
  .tag { font-size: 7px; padding: 0 4px; border-radius: 6px; margin-left: 4px; vertical-align: middle; }
  .tag.oss { background: rgba(74,222,128,.16); color: #4ade80; }
  .tag.priv { background: rgba(96,165,250,.16); color: #60a5fa; }
  @media (prefers-color-scheme: light) { .tag.oss { color: #16a34a; } .tag.priv { color: #2563eb; } }
  .error { color: #f87171; padding: 8px; }
</style>
</head>
<body>
  <h1>CircleCI credits</h1><span class="meta" id="meta"></span>
  <div class="cycle" id="cycle"></div>
  <div class="buckets" id="buckets"></div>
  <table id="table"><thead><tr><th>Project</th><th>Used this cycle</th><th>Proj. cycle</th><th>Proj % limit</th></tr></thead><tbody id="tbody"></tbody></table>
<script>
const CURRENT = "./stats/current.json";
function fmt(n) { return n == null ? "–" : Math.round(n).toLocaleString(); }
function pct(v) { return v == null ? "–" : v + "%"; }
function color(p) { return p >= 100 ? "#ef4444" : p >= 80 ? "#f59e0b" : "#4ade80"; }
function badge(s) { const m = { "on-track": "on track", "at-risk": "at risk", "exceed": "will exceed" }; return '<span class="badge ' + s + '">' + (m[s] || s) + "</span>"; }
function mday(iso) { const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }); }

async function load() {
  try {
    const r = await fetch(CURRENT, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const cur = await r.json();
    const gen = cur.generated_at ? new Date(cur.generated_at).toLocaleString().replace(/:\d+ /, " ") : "?";
    document.getElementById("meta").textContent = "updated " + gen;

    const c = cur.cycle;
    document.getElementById("cycle").innerHTML =
      '<div class="sub">' + mday(c.start) + " → " + mday(c.end) + " · day " + (c.elapsed_days + 1) + " of " + c.length_days
      + " · " + c.remaining_days + " left</div>";

    const b = cur.buckets;
    const card = (label, x) =>
      '<div class="bucket"><div class="blabel">' + label + " · " + fmt(x.limit) + " limit</div>"
      + '<div class="row1"><span class="bnum">' + fmt(x.projected) + "</span>" + badge(x.status) + "</div>"
      + '<div class="bsub">projected use by cycle end · ' + pct(x.projected_pct) + " of limit</div>"
      + '<div class="bar"><div style="width:' + Math.min(x.projected_pct || 0, 100) + "%;background:" + color(x.projected_pct) + '"></div></div>'
      + '<div class="bsub">used so far ~' + fmt(x.used_so_far_est) + " (" + pct(x.limit ? (100 * x.used_so_far_est / x.limit) : 0) + " of limit)</div></div>";
    document.getElementById("buckets").innerHTML = card("OSS (public)", b.oss) + card("Private", b.private);

    const rows = cur.projects.slice().sort((a, z) => z.projected - a.projected);
    const tag = (p) => p ? '<span class="tag priv">P</span>' : '<span class="tag oss">O</span>';
    const ccol = (pp) => pp >= 100 ? "#ef4444" : pp >= 80 ? "#f59e0b" : "";
    let tbody = rows.map(r =>
      "<tr><td>" + r.name + tag(r.private) + "</td>"
      + "<td>" + fmt(r.used_so_far) + "</td>"
      + "<td>" + fmt(r.projected) + "</td>"
      + '<td style="color:' + ccol(r.projected_pct) + '">' + pct(r.projected_pct) + "</td></tr>").join("");
    // Total row (sums across projects; % against the OSS bucket limit).
    const totUsed = rows.reduce((s, r) => s + (r.used_so_far || 0), 0);
    const totProj = rows.reduce((s, r) => s + (r.projected || 0), 0);
    const totPct = cur.limits && cur.limits.oss ? (100 * totProj / cur.limits.oss) : 0;
    tbody += '<tr class="total"><td>Total</td><td>' + fmt(totUsed) + '</td><td>' + fmt(totProj)
      + '</td><td style="color:' + ccol(totPct) + '">' + pct(Math.round(totPct * 10) / 10) + "</td></tr>";
    document.getElementById("tbody").innerHTML = tbody;
  } catch (e) {
    document.getElementById("buckets").innerHTML = '<div class="error">Failed: ' + e.message + "</div>";
  }
}
load();
</script>
</body>
</html>
