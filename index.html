<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CircleCI — credit usage</title>
<style>
  :root { color-scheme: light dark; }
  html, body { background: #0f172a; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 10px 14px 6px; font-size: 12.5px; line-height: 1.35; color: #e2e8f0; }
  @media (prefers-color-scheme: light) { html, body { background: #ffffff; } body { color: #1e293b; } }
  h1 { font-size: 13px; margin: 0 0 2px; font-weight: 600; }
  .meta { font-size: 10px; opacity: .55; margin-bottom: 8px; }

  .buckets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  @media (max-width: 320px) { .buckets { grid-template-columns: 1fr; } }
  .bucket { border: 1px solid rgba(148,163,184,.25); border-radius: 6px; padding: 8px; }
  .bucket .blabel { font-size: 9px; text-transform: uppercase; letter-spacing: .05em; opacity: .7; }
  .bucket .bnum { font-size: 17px; font-weight: 700; margin: 2px 0 0; font-variant-numeric: tabular-nums; }
  .bucket .bsub { font-size: 10px; opacity: .6; }
  .bar { height: 7px; background: rgba(148,163,184,.2); border-radius: 4px; margin-top: 7px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 4px; transition: width .5s; }

  .trend-title { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; opacity: .6; margin: 6px 0 2px; }
  .empty { font-size: 10px; opacity: .6; padding: 6px 0; }

  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  th, td { text-align: right; padding: 3px 8px; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 9px; text-transform: uppercase; letter-spacing: .05em; opacity: .65; border-bottom: 1px solid rgba(148,163,184,.35); }
  td { border-bottom: 1px solid rgba(148,163,184,.12); font-variant-numeric: tabular-nums; }
  tr.total td { border-top: 2px solid rgba(148,163,184,.45); border-bottom: none; font-weight: 700; }
  .tag { font-size: 8px; padding: 1px 5px; border-radius: 8px; margin-left: 6px; vertical-align: middle; }
  .tag.oss { background: rgba(74,222,128,.18); color: #4ade80; }
  .tag.priv { background: rgba(96,165,250,.18); color: #60a5fa; }
  @media (prefers-color-scheme: light) { .tag.oss { color: #16a34a; } .tag.priv { color: #2563eb; } }
  .error { color: #f87171; padding: 8px; }
</style>
</head>
<body>
  <h1>CircleCI — credit usage</h1>
  <div class="meta" id="meta"></div>
  <div class="buckets" id="buckets"></div>
  <div class="trend-title">Cumulative credits by trailing window</div>
  <div id="trend">Loading…</div>
  <div id="content"></div>
<script>
const CURRENT = "./stats/current.json";
const HISTORY = "./stats/history.json";

function fmt(n) { return n.toLocaleString(); }

// Colour shifts from green -> amber -> red as usage approaches/exceeds the limit.
function barColor(percent) {
  if (percent >= 100) return "#ef4444";
  if (percent >= 75) return "#f59e0b";
  return "#4ade80";
}

async function load() {
  try {
    const [cr, hr] = await Promise.all([
      fetch(CURRENT, { cache: "no-store" }),
      fetch(HISTORY, { cache: "no-store" }),
    ]);
    if (!cr.ok) throw new Error("stats HTTP " + cr.status);
    const cur = await cr.json();
    const hist = hr.ok ? await hr.json() : { weeks: [] };
    renderBuckets(cur);
    renderTrend(cur);
    renderTable(cur);
    renderMeta(cur);
  } catch (e) {
    document.getElementById("buckets").innerHTML =
      '<div class="error">Failed to load stats: ' + e.message + "</div>";
  }
}

function bucketCard(label, b) {
  const pct = b.percent || 0;
  return '<div class="bucket"><div class="blabel">' + label + "</div>"
    + '<div class="bnum">' + fmt(b.credits) + "</div>"
    + '<div class="bsub">of ' + fmt(b.limit) + " · " + pct + "% · " + fmt(b.runs) + " runs</div>"
    + '<div class="bar"><div style="width:' + Math.min(pct, 100) + "%;background:" + barColor(pct) + '"></div></div></div>';
}

function renderBuckets(cur) {
  const el = document.getElementById("buckets");
  if (!cur || !cur.oss) { el.innerHTML = '<div class="empty">No data yet</div>'; return; }
  el.innerHTML = bucketCard("OSS (public) — 400k", cur.oss)
    + bucketCard("Private — 30k", cur.private);
}

function renderTrend(cur) {
  const el = document.getElementById("trend");
  const w = cur && cur.windows ? cur.windows : null;
  if (!w) { el.innerHTML = '<div class="empty">No trend data yet</div>'; return; }
  const order = ["last-24-hours", "last-7-days", "last-30-days", "last-90-days"];
  const label = { "last-24-hours": "24h", "last-7-days": "7d", "last-30-days": "30d", "last-90-days": "90d" };
  const rows = order.filter((k) => k in w).map((k) => ({ key: k, credits: w[k].credits || 0 }));
  const maxV = Math.max(1, ...rows.map((r) => r.credits));
  const H = 20 + rows.length * 16 + 4;
  const W = 300;
  let html = '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;max-width:420px" preserveAspectRatio="xMidYMid meet">';
  rows.forEach((r, i) => {
    const y = 6 + i * 16;
    const bw = Math.max(4, (r.credits / maxV) * (W - 90));
    const c = r.credits > 0 ? "#60a5fa" : "rgba(148,163,184,.4)";
    html += '<rect x="90" y="' + y + '" width="' + bw.toFixed(1) + '" height="9" rx="2" fill="' + c + '">'
      + "<title>" + label[r.key] + ": " + fmt(r.credits) + " credits</title></rect>";
    html += '<text x="86" y="' + (y + 8) + '" font-size="9" text-anchor="end" opacity=".7">' + label[r.key] + "</text>";
    html += '<text x="' + (94 + bw).toFixed(1) + '" y="' + (y + 8) + '" font-size="9" opacity=".9">' + fmt(r.credits) + "</text>";
  });
  html += "</svg>";
  el.innerHTML = html;
}

function renderTable(cur) {
  const el = document.getElementById("content");
  if (!cur || !cur.projects) { el.innerHTML = '<div class="empty">No data yet</div>'; return; }
  let rows = cur.projects.slice();
  rows.sort((a, b) => b.credits - a.credits);
  let oss = 0, priv = 0;
  for (const r of rows) { if (r.private) priv += r.credits; else oss += r.credits; }
  const tag = (p) => p ? '<span class="tag priv">PRIVATE</span>' : '<span class="tag oss">OSS</span>';
  let html = '<table><thead><tr><th>Project</th><th>Credits</th><th>Runs</th><th>% of bucket</th></tr></thead><tbody>';
  for (const r of rows) {
    const limit = r.private ? cur.private.limit : cur.oss.limit;
    const pct = limit ? ((r.credits / limit) * 100).toFixed(1) : "0";
    html += "<tr><td>" + r.name + tag(r.private) + "</td>"
      + "<td>" + fmt(r.credits) + "</td>"
      + "<td>" + fmt(r.runs) + "</td><td>" + pct + "%</td></tr>";
  }
  html += '<tr class="total"><td>OSS bucket</td><td>' + fmt(oss) + "</td><td></td><td></td></tr>";
  html += '<tr class="total"><td>Private bucket</td><td>' + fmt(priv) + "</td><td></td><td></td></tr>";
  html += "</tbody></table>";
  el.innerHTML = html;
}

function renderMeta(cur) {
  const el = document.getElementById("meta");
  if (!cur) { el.textContent = "no data"; return; }
  const gen = cur.generated_at ? new Date(cur.generated_at).toLocaleString() : "unknown";
  el.textContent = "Window: " + (cur.window || "current") + " · Total " + fmt(cur.totals.total_credits)
    + " credits · Updated " + gen + " — weekly by GitHub Actions";
}

load();
</script>
</body>
</html>
