name: weekly-circleci-stats

on:
  schedule:
    - cron: "0 * * * *"   # every hour, top of the hour
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect CircleCI credit stats
        env:
          CIRCLE_TOKEN: ${{ secrets.CIRCLE_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python .github/scripts/collect_stats.py
      - name: Commit and push
        run: |
          git config user.name "circleci-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats/
          if git diff --cached --quiet; then
            echo "no changes to stats"
            exit 0
          fi
          git commit -m "chore: refresh circleci credit stats"

          # GitHub occasionally fails the ref update with a server-side
          # "remote: fatal error in commit_refs" / "! [remote rejected]
          # main -> main (failure)". That is transient, not a permissions
          # problem (main has no branch protection or rulesets), so retry with
          # a short backoff instead of failing the whole run.
          # Seen on run 42848557749 (2026-11-10T15:50:37Z).
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "push succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::push attempt ${attempt} failed"
            sleep $(( attempt * 15 ))
          done
          echo "::error::push failed after 5 attempts; stats were collected but not committed"
          exit 1
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
