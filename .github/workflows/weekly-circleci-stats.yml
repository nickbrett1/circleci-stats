name: weekly-circleci-stats

on:
  schedule:
    - cron: "0 * * * *"   # every hour, top of the hour   (was "45 5,17 * * *") # 05:45 & 17:45 UTC, every day
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect CircleCI credit stats
        env:
          CIRCLE_TOKEN: ${{ secrets.CIRCLE_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python .github/scripts/collect_stats.py
      - name: Commit and push
        run: |
          git config user.name "circleci-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats/
          if git diff --cached --quiet; then
            echo "no changes to stats"
          else
            git commit -m "chore: refresh circleci credit stats"
            git push
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
